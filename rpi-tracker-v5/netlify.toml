[build]
  functions = "netlify/functions"
  publish   = "."

[functions]
  node_bundler = "esbuild"

[[redirects]]
  from   = "/api/airtable"
  to     = "/.netlify/functions/airtable"
  status = 200

[[redirects]]
  from   = "/api/analyze"
  to     = "/.netlify/functions/analyze-background"
  status = 200

[functions."analyze-background"]
  timeout = 300
